name: Straz Alert AI Worker

on:
  schedule:
    - cron: '*/10 * * * *' # Odpalaj w tle co 10 minut 24/7
  workflow_dispatch:       # Pozwala też odpalić skrypt ręcznie jednym przyciskiem

jobs:
  scrape-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalacja bibliotek
        run: pip install google-genai supabase feedparser requests
      - name: Uruchomienie skryptu AI
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python worker.py
