<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Straż Alert Live</title>
  <meta name="theme-color" content="#090a0f">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --font-sans: 'Inter', sans-serif; --font-tech: 'Chakra Petch', sans-serif; --font-mono: 'JetBrains Mono', monospace; }
    body { font-family: var(--font-sans); background-color: #06070a; color: #f1f5f9; overflow: hidden; height: 100vh; width: 100vw; -webkit-tap-highlight-color: transparent; }
    .font-tech { font-family: var(--font-tech); }
    .font-mono { font-family: var(--font-mono); }
    #map { height: 100vh; width: 100vw; z-index: 10; background: #07090e; }
    .straz-popup .leaflet-popup-content-wrapper { background: rgba(13, 16, 23, 0.96) !important; color: #f8fafc !important; border: 1px solid rgba(239, 68, 68, 0.4) !important; border-radius: 16px !important; box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.8), 0 0 25px rgba(239, 68, 68, 0.25) !important; backdrop-filter: blur(12px); padding: 4px; }
    .straz-popup .leaflet-popup-tip { background: rgba(13, 16, 23, 0.96) !important; border: 1px solid rgba(239, 68, 68, 0.4) !important; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    .pulse-ring { position: absolute; border-radius: 50%; animation: pulsate 2s infinite ease-out; opacity: 0; }
    @keyframes pulsate { 0% { transform: scale(0.6); opacity: 0.9; } 50% { opacity: 0.4; } 100% { transform: scale(2.4); opacity: 0; } }
    .status-badge-fire { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; }
    .status-badge-accident { background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.4); color: #fbbf24; }
    .status-badge-hazard { background: rgba(14, 165, 233, 0.15); border: 1px solid rgba(14, 165, 233, 0.4); color: #38bdf8; }
  </style>
</head>
<body class="relative select-none">

  <!-- ALERT TOAST Z GÓRY EKRANU -->
  <div id="toast-alert" style="display: none; z-index: 999999;" class="fixed top-3 left-3 right-3 max-w-md mx-auto bg-slate-900/95 border-2 border-red-500/80 rounded-2xl p-3.5 shadow-2xl backdrop-blur-xl transition-all duration-300">
    <div class="flex items-start gap-3 cursor-pointer" id="toast-click-area">
      <div class="relative flex-shrink-0 mt-0.5">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
        <div class="relative inline-flex rounded-full h-8 w-8 bg-red-600 items-center justify-center text-white shadow-lg shadow-red-600/50">
          <i data-lucide="siren" class="w-4 h-4 animate-bounce"></i>
        </div>
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <span class="text-[11px] font-mono uppercase tracking-wider font-bold text-red-400">NOWY MELDUNEK NA ŻYWO</span>
          <span class="text-[10px] text-slate-400 font-mono" id="toast-time"></span>
        </div>
        <h4 id="toast-title" class="text-sm font-bold text-white truncate font-tech mt-0.5"></h4>
        <p id="toast-desc" class="text-xs text-slate-300 line-clamp-1 mt-0.5"></p>
        <div class="mt-1 flex items-center gap-1.5 text-[10px] text-amber-400 font-medium">
          <i data-lucide="navigation" class="w-3 h-3"></i>
          <span>Kliknij, aby przejść do miejsca na mapie</span>
        </div>
      </div>
      <button id="toast-close" class="text-slate-400 hover:text-white p-1">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- GÓRNY PASEK APLIKACJI -->
  <header style="z-index: 40;" class="fixed top-0 left-0 right-0 h-16 bg-slate-950/85 backdrop-blur-md border-b border-slate-800/80 px-4 flex items-center justify-between pointer-events-auto">
    <div class="flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-500 to-amber-600 flex items-center justify-center shadow-lg shadow-red-500/20 border border-red-400/30">
        <i data-lucide="flame" class="w-6 h-6 text-white"></i>
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <span class="font-tech text-lg font-bold tracking-wider text-white">STRAŻ ALERT</span>
          <span class="px-1.5 py-0.2 text-[9px] font-mono font-bold bg-red-500/20 text-red-400 border border-red-500/40 rounded">LIVE</span>
        </div>
        <p class="text-[10px] text-slate-400 font-mono tracking-tight flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> SYSTEM 24/7 • PSP & OSP
        </p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-toggle-incidents" class="h-9 px-3 rounded-xl bg-slate-900 border border-slate-700/70 text-slate-200 text-xs font-medium flex items-center gap-1.5 active:scale-95 transition-all">
        <i data-lucide="list" class="w-4 h-4 text-red-400"></i>
        <span id="header-counter" class="bg-red-500/20 text-red-400 font-mono text-[10px] px-1.5 py-0.5 rounded-full font-bold">0</span>
      </button>
    </div>
  </header>

  <!-- MAPA GŁÓWNA -->
  <div id="map"></div>

  <!-- DOLNY PASEK NAWIGACJI -->
  <nav style="z-index: 40;" class="fixed bottom-0 left-0 right-0 h-16 bg-slate-950/90 backdrop-blur-lg border-t border-slate-800/80 px-3 flex items-center justify-around pointer-events-auto">
    <button id="nav-btn-map" class="flex flex-col items-center justify-center flex-1 py-1 text-red-500">
      <i data-lucide="map" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium font-tech mt-1">Mapa</span>
    </button>
    <button id="nav-btn-incidents" class="flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-slate-200">
      <i data-lucide="flame" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium font-tech mt-1">Meldunki</span>
    </button>
    <button id="nav-btn-sis" class="flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-slate-200">
      <i data-lucide="shield" class="w-5 h-5"></i>
      <span class="text-[10px] font-medium font-tech mt-1">SiŚ Info</span>
    </button>
  </nav>

  <!-- SZUFLADA MELDUNKÓW -->
  <div id="incidents-panel" style="display: none; z-index: 50;" class="fixed inset-x-0 bottom-0 max-w-lg mx-auto bg-slate-950/95 border-t border-slate-800 rounded-t-3xl backdrop-blur-xl shadow-2xl flex flex-col h-[75vh]">
    <div class="px-5 py-3 border-b border-slate-800/70 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="radio" class="w-5 h-5 text-red-500 animate-pulse"></i>
        <h3 class="font-tech text-base font-bold text-white uppercase tracking-wider">Meldunki operacyjne</h3>
      </div>
      <button id="close-incidents-panel" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
    <div id="incidents-list" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar"></div>
  </div>

  <!-- MODAL: KARTA SZCZEGÓŁÓW -->
  <div id="details-modal" style="display: none; z-index: 99999;" class="fixed inset-0 bg-black/80 backdrop-blur-sm items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-900 border border-slate-700/80 w-full max-w-lg rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl max-h-[85vh] overflow-y-auto custom-scrollbar">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
        <span id="detail-badge" class="px-2.5 py-1 rounded-full text-xs font-mono font-bold"></span>
        <button onclick="closeModal('details-modal')" class="text-slate-400 hover:text-white p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <h3 id="detail-title" class="font-tech text-xl font-bold text-white mb-2"></h3>
      <div class="flex items-center gap-2 text-xs text-slate-400 font-mono mb-4">
        <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-500"></i>
        <span id="detail-time"></span>
        <span>•</span>
        <i data-lucide="map-pin" class="w-3.5 h-3.5 text-slate-500"></i>
        <span id="detail-location"></span>
      </div>
      <div class="bg-slate-950/60 rounded-xl p-3.5 border border-slate-800/80 mb-4">
        <div class="text-[11px] font-mono text-slate-400 uppercase tracking-wider mb-1 font-bold">Siły i Środki (SiŚ):</div>
        <p id="detail-units" class="text-sm font-semibold text-amber-400 font-tech"></p>
      </div>
      <div class="text-sm text-slate-300 leading-relaxed mb-6" id="detail-desc"></div>
      <button onclick="closeModal('details-modal')" class="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-tech font-bold text-sm tracking-wider uppercase transition-colors">
        Wróć do mapy
      </button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // PODŁĄCZENIE DO TWOJEGO PROJEKTU SUPABASE
    const SUPABASE_URL = 'https://cmjlebtqwyyplwdcklzn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNtamxlYnRxd3l5cGx3ZGNrbHpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNTk5OTksImV4cCI6MjEwNzczNTk5OX0.YczVUJnRBcjMBdaKzgQij7MENxN6vDWfe8Btt2sP5-c'; // WKLEJ TUTAJ SWÓJ KLUCZ anon public Z NOTATNIKA!

    let map, markersLayer;
    let incidents = [];

    function initMap() {
      // Centrujemy mapę domyślnie na Polskę centralną (woj. łódzkie / Stryków / A1-A2)
      map = L.map('map', { zoomControl: false }).setView([51.90, 19.60], 9);
      
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
        maxZoom: 19
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);
      setTimeout(() => map.invalidateSize(), 300);
    }

    function renderMarkers() {
      markersLayer.clearLayers();
      incidents.forEach(item => {
        const color = item.category === 'fire' ? '#ef4444' : (item.category === 'accident' ? '#f59e0b' : '#0ea5e9');
        const iconHtml = `
          <div class="relative flex items-center justify-center w-8 h-8">
            <span class="pulse-ring w-8 h-8" style="background-color: ${color};"></span>
            <div class="w-7 h-7 rounded-full flex items-center justify-center shadow-lg border-2 border-white/80" style="background-color: ${color};">
              <span class="text-[11px] font-bold text-white font-mono">${item.category === 'fire' ? '🔥' : (item.category === 'accident' ? '🚗' : '⚠️')}</span>
            </div>
          </div>
        `;

        const customIcon = L.divIcon({
          className: 'custom-pin',
          html: iconHtml,
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        });

        const marker = L.marker([item.lat, item.lng], { icon: customIcon });
        const popupContent = `
          <div class="p-2 min-w-[220px]">
            <div class="flex items-center justify-between gap-2 mb-1.5">
              <span class="text-[10px] font-mono font-bold px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">${item.time}</span>
              <span class="text-[10px] font-mono text-red-400 font-bold uppercase tracking-wider">${item.status}</span>
            </div>
            <h4 class="font-tech text-sm font-bold text-white leading-snug mb-1">${item.title}</h4>
            <p class="text-xs text-slate-300 font-medium mb-2">${item.location}</p>
            <button onclick="window.openDetails(${item.id})" class="w-full py-1.5 rounded-lg bg-red-600 hover:bg-red-500 text-white font-tech text-xs font-bold tracking-wider uppercase transition-colors">
              Szczegóły SiŚ
            </button>
          </div>
        `;
        marker.bindPopup(popupContent, { className: 'straz-popup', closeButton: true });
        marker.addTo(markersLayer);
      });

      document.getElementById('header-counter').innerText = incidents.length;
    }

    function renderList() {
      const listEl = document.getElementById('incidents-list');
      if (incidents.length === 0) {
        listEl.innerHTML = `<div class="text-center py-12 text-slate-500 font-mono text-xs">Brak aktywnych zgłoszeń. Czekam na meldunki z AI...</div>`;
        return;
      }

      listEl.innerHTML = incidents.map(item => `
        <div onclick="window.zoomToIncident(${item.id})" class="p-3.5 rounded-2xl bg-slate-900/80 border border-slate-800 hover:border-red-500/50 cursor-pointer transition-all active:scale-[0.98]">
          <div class="flex items-center justify-between text-xs font-mono mb-1">
            <span class="font-bold text-red-400">${item.time}</span>
            <span class="text-slate-400">${item.location}</span>
          </div>
          <h4 class="font-tech text-sm font-bold text-white mb-1.5">${item.title}</h4>
          <div class="text-xs text-amber-400/90 font-mono font-medium truncate mb-2">SiŚ: ${item.units}</div>
          <p class="text-xs text-slate-400 line-clamp-2">${item.desc}</p>
        </div>
      `).join('');
    }

    window.openDetails = function(id) {
      const item = incidents.find(x => x.id == id);
      if (!item) return;
      document.getElementById('detail-title').innerText = item.title;
      document.getElementById('detail-time').innerText = item.time;
      document.getElementById('detail-location').innerText = item.location;
      document.getElementById('detail-units').innerText = item.units;
      document.getElementById('detail-desc').innerText = item.desc;
      const badge = document.getElementById('detail-badge');
      badge.innerText = item.status;
      badge.className = `px-2.5 py-1 rounded-full text-xs font-mono font-bold ${item.category === 'fire' ? 'status-badge-fire' : 'status-badge-accident'}`;
      document.getElementById('details-modal').style.display = 'flex';
    };

    window.zoomToIncident = function(id) {
      const item = incidents.find(x => x.id == id);
      if (!item) return;
      document.getElementById('incidents-panel').style.display = 'none';
      map.flyTo([item.lat, item.lng], 13, { duration: 1.2 });
      setTimeout(() => {
        markersLayer.eachLayer(m => {
          if (m.getLatLng().lat === item.lat && m.getLatLng().lng === item.lng) {
            m.openPopup();
          }
        });
      }, 1300);
    };

    function showToast(item) {
      const toast = document.getElementById('toast-alert');
      document.getElementById('toast-time').innerText = item.time;
      document.getElementById('toast-title').innerText = item.title;
      document.getElementById('toast-desc').innerText = `${item.location} • SiŚ: ${item.units}`;
      toast.style.display = 'flex';

      document.getElementById('toast-click-area').onclick = () => {
        toast.style.display = 'none';
        window.zoomToIncident(item.id);
      };

      document.getElementById('toast-close').onclick = (e) => {
        e.stopPropagation();
        toast.style.display = 'none';
      };

      setTimeout(() => { toast.style.display = 'none'; }, 9000);
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    // POBIERANIE DANYCH Z SUPABASE ORAZ NASŁUCHIWANIE NA ŻYWO (REALTIME)
    async function initSupabase() {
      if (SUPABASE_ANON_KEY === 'TWOJ_ANON_PUBLIC_KEY') {
        console.warn('Wklej klucz anon public w kodzie pliku index.html');
        return;
      }

      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // Pobierz istniejące meldunki
      const { data } = await client
        .from('incidents')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(100);

      if (data && data.length > 0) {
        incidents = data.map(r => ({
          id: r.id,
          title: r.title,
          category: r.category,
          status: r.status,
          location: r.location,
          lat: r.lat,
          lng: r.lng,
          dateStr: r.date_str,
          time: r.time_str,
          units: r.units,
          desc: r.description
        }));
        renderMarkers();
        renderList();
      }

      // Nasłuchuj na nowe zgłoszenia generowane przez skrypt w chmurze
      client
        .channel('public:incidents')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'incidents' }, payload => {
          const r = payload.new;
          const newItem = {
            id: r.id,
            title: r.title,
            category: r.category,
            status: r.status,
            location: r.location,
            lat: r.lat,
            lng: r.lng,
            dateStr: r.date_str,
            time: r.time_str,
            units: r.units,
            desc: r.description
          };
          incidents.unshift(newItem);
          renderMarkers();
          renderList();
          showToast(newItem);
        })
        .subscribe();
    }

    // OBSŁUGA PRZYCISKÓW MENU
    document.getElementById('btn-toggle-incidents').addEventListener('click', () => {
      const p = document.getElementById('incidents-panel');
      p.style.display = p.style.display === 'none' ? 'flex' : 'none';
    });
    document.getElementById('nav-btn-incidents').addEventListener('click', () => {
      document.getElementById('incidents-panel').style.display = 'flex';
    });
    document.getElementById('nav-btn-map').addEventListener('click', () => {
      document.getElementById('incidents-panel').style.display = 'none';
    });
    document.getElementById('close-incidents-panel').addEventListener('click', () => {
      document.getElementById('incidents-panel').style.display = 'none';
    });

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initMap();
      initSupabase();
    });
  </script>
</body>
</html>
